name: Deploy Laravel to Hostinger (MASTER)

on:
  push:
    branches:
      - master

jobs:
  deploy-master:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger via SSH (MASTER)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          script: |
            set -e

            cd domains/tecnonautaserviciotecnico.creatingsoft.net/public_html/master

            echo "📥 Sincronizando repositorio..."
            git fetch origin
            git reset --hard origin/master

            echo "📦 Instalando dependencias (producción)..."
            composer install --no-dev --no-interaction --optimize-autoloader

            echo "🧠 Verificando autoload optimizado..."
            composer dump-autoload -o

            echo "🧹 Limpiando cache..."
            php artisan optimize:clear

            echo "🗄️ Ejecutando migraciones..."
            php artisan migrate --force

            echo "⚡ Generando cache productivo..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "🚀 Deploy MASTER completado con éxito"

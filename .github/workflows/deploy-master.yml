name: Deploy Laravel to Hostinger (MASTER)

on:
  push:
    branches:
      - master

jobs:
  deploy-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for connectivity check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: node scripts/check-ssh.cjs

      - name: Deploy to Hostinger via SSH (MASTER)
        uses: appleboy/ssh-action@v1.2.0
        env:
          QUEUE_CRON_MANAGED_EXTERNALLY: ${{ vars.QUEUE_CRON_MANAGED_EXTERNALLY }}
        with:
          envs: QUEUE_CRON_MANAGED_EXTERNALLY
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            cd domains/tecnonautaserviciotecnico.creatingsoft.net/public_html/master

            echo "📥 Sincronizando repositorio..."
            git fetch origin
            git reset --hard origin/master

            echo "📦 Instalando dependencias (producción)..."
            composer install --no-dev --no-interaction --optimize-autoloader

            echo "🧠 Verificando autoload optimizado..."
            composer dump-autoload -o

            echo "🧹 Limpiando cache..."
            php artisan optimize:clear
            php artisan permission:cache-reset

            echo "🗄️ Ejecutando migraciones y seeder de permisos..."
            php artisan migrate --force
            php artisan db:seed --class=PermissionSeeder --force

            echo "⚡ Generando cache productivo..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "🔄 Reiniciando workers e instalando cron de cola..."
            php artisan queue:restart
            bash scripts/install-queue-cron.sh

            echo "🚀 Deploy MASTER completado con éxito"
